networks:
  neuralforge-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  kafka_data:
  prometheus_data:
  grafana_data:

services:

  # ─── DATABASE ───────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: neuralforge-postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    networks:
      - neuralforge-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── REDIS ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: neuralforge-redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - neuralforge-net

  # ─── KAFKA ──────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: neuralforge-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    networks:
      - neuralforge-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: neuralforge-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    ports:
      - "9093:9092"
    networks:
      - neuralforge-net

  # ─── BACKEND (Spring Boot) ───────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: neuralforge-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD}
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      JWT_SECRET: ${JWT_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      AI_ENGINE_URL: http://ai-engine:8090
    ports:
      - "8081:8080"
    networks:
      - neuralforge-net

  # ─── AI ENGINE ───────────────────────────────────────────
  ai-engine:
    build:
      context: ./ai-engine
      dockerfile: Dockerfile
    container_name: neuralforge-ai-engine
    depends_on:
      - kafka
      - redis
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PINECONE_API_KEY: ${PINECONE_API_KEY}
      PINECONE_ENV: ${PINECONE_ENV}
      PINECONE_INDEX: ${PINECONE_INDEX}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    ports:
      - "8091:8090"
    networks:
      - neuralforge-net

  # ─── FRONTEND (React) ────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: neuralforge-frontend
    depends_on:
      - backend
    environment:
      REACT_APP_API_URL: http://localhost:8081
      REACT_APP_WS_URL: ws://localhost:8081/ws
      REACT_APP_GRAPHQL_URL: http://localhost:8081/graphql
    ports:
      - "3030:3000"
    networks:
      - neuralforge-net

  # ─── PROMETHEUS ──────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: neuralforge-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - neuralforge-net

  # ─── GRAFANA ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: neuralforge-grafana
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_PASSWORD: neuralforge123
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3031:3000"
    networks:
      - neuralforge-net
